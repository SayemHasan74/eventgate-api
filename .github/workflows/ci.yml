name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://eventgate:eventgate@localhost:5432/eventgate?schema=public
      TEST_DATABASE_URL: postgresql://eventgate:eventgate@localhost:5432/eventgate_test?schema=public
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventgate
          POSTGRES_PASSWORD: eventgate
          POSTGRES_DB: eventgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventgate -d eventgate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations to the dedicated test database
        run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Run local verification
        run: npm run check

      - name: Run tests
        run: npm test
